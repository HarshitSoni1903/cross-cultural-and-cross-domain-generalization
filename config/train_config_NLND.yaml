model:
  base_model: "FacebookAI/xlm-roberta-base"
  num_labels: 5
  task_type: "classification"  # "classification" or "regression"
  # For classification: 3 classes (Negative=0, Neutral=1, Positive=2)
  # For regression: continuous ratings 1-5
  training_schema: "single"  # "single" or "dual_encoder"
  # single: Standard single encoder training
  # dual_encoder: Dual-encoder with frozen pre-trained encoder + trainable new encoder
  pretrained_encoder_path: "/mnt/e/code/cross-cultural-and-cross-domain-generalization/outputs/classification_trans_fr_20251107_103755/checkpoint-epoch-1"  # Path to pre-trained checkpoint (required if training_schema="dual_encoder")
  
training:
  batch_size: 64
  learning_rate: 0.00002  # 2e-5 as float
  num_epochs: 1
  warmup_steps: 500
  weight_decay: 0.01
  max_length: 512
  
data:
  data_path: "data"  # Base path to data directory. The dataset looks for {data_path}/amazon_review/language/train.jsonl
  train_languages: ["en","zh",'fr','ja']  # Used only when use_translation=false. When use_translation=true, ALL available languages are used automatically.
  use_translation: true  # ONLY for single encoder mode: true: use review_body_en from ALL available languages, false: use review_body from specified languages only
  domain_info: false  # true: add "Category: {product_category}" prefix to all texts (always in English, using original label)
  output_dir: "./outputs/NLND"
  save_steps: 1000
  eval_steps: 1000
  logging_steps: 100

evaluation:
  max_points: 10000
